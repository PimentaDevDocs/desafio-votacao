spring.application.name=desafio-votacao

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/votacao}
spring.datasource.username=${DB_USER:votacao}
spring.datasource.password=${DB_PASSWORD:votacao}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

server.port=8080