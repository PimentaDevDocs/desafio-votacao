spring.application.name=desafio-votacao

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/votacao}
spring.datasource.username=${DB_USER:votacao}
spring.datasource.password=${DB_PASSWORD:votacao}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

server.port=8080

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] --- [%15.15t] %-40.40logger{39} : %m%n
logging.level.br.com.vitormarques.votacao=INFO
app.base-url=${APP_BASE_URL:http://localhost:8080}